[workspace]
members = [".", "crates/clash-protocol", "crates/clash-forge-client"]
resolver = "3"

[package]
name = "neo_forge_3d"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib"]

[features]
# Doku der Klassen für die Godot-Hilfe (F1 im Editor); der Export (tools/export_table.sh) baut ohne
default = ["register-docs"]
register-docs = ["godot/register-docs"]

[dependencies]
godot = { version = "0.5.5", features = ["api-4-7"] }
clash-protocol = { path = "crates/clash-protocol" }
clash-forge-client = { path = "crates/clash-forge-client" }
serde_json = "1"

# Godot lädt im Editor und beim Start aus NeoForge die Debug-Bibliothek (target/debug, siehe
# godot/rust.gdextension), deshalb wird auch sie optimiert gebaut: unoptimiert brauchte der
# Rust-Code je Bild etwa doppelt so viel Rechenzeit. Abhängigkeiten (godot) werden selten neu
# gebaut und dürfen voll optimiert sein; Debug-Informationen bleiben.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
